# HSC Science Revision Master — multi-platform CI.
# Runs on a PUBLIC repo, where GitHub Actions minutes are unlimited.
# No iOS / macOS jobs (those platforms are out of scope for this app).
#
# NOTE on binary assets: the repo stores text files only (launcher PNGs,
# gradle-wrapper.jar, web icons and the Windows .ico are binary, so they are
# NOT committed). Each job restores them from a fresh `flutter create`
# template (default Flutter icons) before building — see the
# "Restore binary assets" step below.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - name: Restore binary assets from flutter template
        run: |
          flutter create --org com.afterclass.hsc --project-name hsc_revision_master --platforms=android,web,windows,linux "$RUNNER_TEMP/flutter-template"
          cp -r "$RUNNER_TEMP/flutter-template/android/app/src/main/res/mipmap-"* android/app/src/main/res/
          cp "$RUNNER_TEMP/flutter-template/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Split per ABI: the fat APK was 57 MB (three copies of
      # libflutter.so + libapp.so, one per ABI). Per-ABI APKs are
      # ~20 MB each — arm64 is the one Rafi's phone needs, and under
      # Telegram's 50 MB bot-upload limit too.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - name: Restore binary assets from flutter template
        run: |
          flutter create --org com.afterclass.hsc --project-name hsc_revision_master --platforms=android,web,windows,linux "$RUNNER_TEMP/flutter-template"
          cp "$RUNNER_TEMP/flutter-template/web/favicon.png" web/
          cp "$RUNNER_TEMP/flutter-template/web/icons/"*.png web/icons/
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - name: Restore binary assets from flutter template
        shell: bash
        run: |
          flutter create --org com.afterclass.hsc --project-name hsc_revision_master --platforms=android,web,windows,linux "$RUNNER_TEMP/flutter-template"
          cp "$RUNNER_TEMP/flutter-template/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/ || true
          cp "$RUNNER_TEMP/flutter-template/windows/runner/resources/app_icon.ico" windows/runner/resources/
          cp -r "$RUNNER_TEMP/flutter-template/android/app/src/main/res/mipmap-"* android/app/src/main/res/ || true
      - run: flutter pub get
      - run: flutter build windows --release
      # setup.exe (not portable): Inno Setup wraps the Release folder
      # into a per-user installer. The version comes from pubspec.yaml.
      - name: Build Windows setup.exe with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').ToString().Split(':')[1].Trim().Split('+')[0])
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" windows\installer.iss
          Get-ChildItem installer-output
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer-output/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release

